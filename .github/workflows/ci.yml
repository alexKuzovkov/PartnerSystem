name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build services
        run: |
          dotnet build src/UserService/UserService.csproj -c Release
          dotnet build src/EventService/EventService.csproj -c Release
          dotnet build src/CommissionService/CommissionService.csproj -c Release
          dotnet build src/WalletService/WalletService.csproj -c Release

      - name: Run unit tests
        run: |
          dotnet test tests/CommissionService.Tests/CommissionService.Tests.csproj -c Release
          dotnet test tests/WalletService.Tests/WalletService.Tests.csproj -c Release

      - name: Validate Docker Compose
        run: docker compose config --quiet

  powershell-end-to-end:
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run PowerShell end-to-end suite
        shell: pwsh
        run: ./test_all.ps1 -StartServices

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Clean up Docker resources
        if: always()
        run: docker compose down -v --remove-orphans
