services:
  redis:
    image: redis:7-alpine
    container_name: partner_system_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - partner-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: partner_system_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    networks:
      - partner-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: partner_system_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - partner-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  userservice:
    build:
      context: .
      dockerfile: src/UserService/Dockerfile
    container_name: partner_system_userservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # ASPNETCORE_URLS is intentionally omitted; Kestrel endpoints are configured in Program.cs
      # Kestrel__* environment variables are intentionally omitted; endpoint configuration lives in code
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=users_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-password123}
    ports:
      # Expose 8081 for the REST API and health checks
      - "5001:8081"
      # Port 8080 remains internal because gRPC is used only inside the Docker network
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - partner-network
    healthcheck:
      # Health check uses the HTTP/1.1 endpoint on port 8081
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  eventservice:
    build:
      context: .
      dockerfile: src/EventService/Dockerfile
    container_name: partner_system_eventservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=events_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-password123}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - partner-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  commissionservice:
    build:
      context: .
      dockerfile: src/CommissionService/Dockerfile
    container_name: partner_system_commissionservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=commissions_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-password123}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - Redis__ConnectionString=redis:6379
      # gRPC uses port 8080 (HTTP/2) inside the Docker network
      - UserService__GrpcAddress=http://userservice:8080
    ports:
      - "5003:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      userservice:
        condition: service_healthy
    networks:
      - partner-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  walletservice:
    build:
      context: .
      dockerfile: src/WalletService/Dockerfile
    container_name: partner_system_walletservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=wallets_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-password123}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - PayoutSettings__IntervalSeconds=2
    ports:
      - "5004:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - partner-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  partner-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local